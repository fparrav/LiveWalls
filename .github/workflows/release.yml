name: 🚀 Release LiveWalls

on:
  push:
    tags:
      - 'v*.*.*'

env:
  APP_NAME: "LiveWalls"
  SCHEME_NAME: "LiveWalls"
  DIST_REPO: "fparrav/livewalls-dist"
  TAP_REPO: "fparrav/homebrew-livewalls"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: livewalls-release
      cancel-in-progress: false
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔢 Capture Version
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📋 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.xcodeproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: 🔍 Validate Project Configuration
        run: |
          echo "🔍 Validating project configuration..."

          if [ ! -f "$APP_NAME/Info.plist" ]; then
            echo "❌ Error: Info.plist not found at $APP_NAME/Info.plist"
            exit 1
          fi

          plutil -lint "$APP_NAME/Info.plist"
          if [ $? -ne 0 ]; then
            echo "❌ Error: Info.plist is not valid"
            exit 1
          fi

          echo "📋 Info.plist validation successful. Key information:"
          plutil -p "$APP_NAME/Info.plist" | grep -E "(CFBundleIdentifier|CFBundleExecutable|CFBundleName|CFBundleShortVersionString)"

          if [ ! -f "$APP_NAME.xcodeproj/project.pbxproj" ]; then
            echo "❌ Error: Xcode project file not found"
            exit 1
          fi

          xcodebuild -version

          echo "📋 Available schemes:"
          xcodebuild -list -project "$APP_NAME.xcodeproj"

          echo "✅ Project configuration validation complete"

      - name: 🔍 Validate Xcode Project Settings
        run: |
          echo "🔍 Validating Xcode project settings..."

          echo "📋 Checking code signing settings..."
          xcodebuild -project "$APP_NAME.xcodeproj" -target "$APP_NAME" -configuration Release -showBuildSettings | grep -E "(CODE_SIGN|DEVELOPMENT_TEAM)" || true

          TEAM_SETTING=$(xcodebuild -project "$APP_NAME.xcodeproj" -target "$APP_NAME" -configuration Release -showBuildSettings | grep "DEVELOPMENT_TEAM" | head -1)
          if [[ "$TEAM_SETTING" == *"CED7KEV553"* ]]; then
            echo "⚠️ Warning: Development team still set in project settings"
          else
            echo "✅ Development team properly cleared"
          fi

          echo "📋 Checking deployment target..."
          xcodebuild -project "$APP_NAME.xcodeproj" -target "$APP_NAME" -configuration Release -showBuildSettings | grep "MACOSX_DEPLOYMENT_TARGET" | head -1

          echo "📋 Checking bundle identifier..."
          xcodebuild -project "$APP_NAME.xcodeproj" -target "$APP_NAME" -configuration Release -showBuildSettings | grep "PRODUCT_BUNDLE_IDENTIFIER" | head -1

          if [ ! -f "$APP_NAME/LiveWalls.entitlements" ]; then
            echo "❌ Error: Entitlements file not found"
            exit 1
          fi

          echo "📋 Entitlements file content:"
          cat "$APP_NAME/LiveWalls.entitlements"

          echo "✅ Xcode project settings validation complete"

      - name: 🧪 Run Unit Tests
        run: |
          echo "🧪 Running unit tests..."
          xcodebuild test \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -destination "platform=macOS" \
            -configuration Release \
            -derivedDataPath ./DerivedDataTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || {
            echo "⚠️ Unit tests failed, but continuing with build..."
            echo "📋 Test failure details:"
            find ./DerivedDataTests -name "*.xcresult" -exec xcrun xcresulttool get --format json {} \; | head -20 || true
          }

          echo "✅ Unit tests completed"

      - name: 🏗️ Build App
        run: |
          set -o pipefail
          echo "🔨 Building $APP_NAME..."

          mkdir -p ./build

          echo "📁 Current directory: $(pwd)"
          echo "📁 Directory contents:"
          ls -la

          echo "🔨 Starting Xcode build process..."
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath ./DerivedData \
            -archivePath "./build/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -verbose | tee build_log.txt

          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo "📋 Last 300 lines of build log:"
            tail -300 build_log.txt || true
            echo "🛟 Fallback: building (no archive) to extract .app..."
            xcodebuild \
              -project "$APP_NAME.xcodeproj" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination "generic/platform=macOS" \
              -derivedDataPath ./DerivedData \
              build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              -quiet | tee build_fallback_log.txt || true

            DERIVED_APP=$(find ./DerivedData/Build/Products -type d -name "$APP_NAME.app" | head -n 1 || true)
            if [ -d "$DERIVED_APP" ]; then
              mkdir -p ./build/export
              rm -rf ./build/export/$APP_NAME.app || true
              cp -R "$DERIVED_APP" ./build/export/
              echo "✅ Fallback copied app from $DERIVED_APP to ./build/export/$APP_NAME.app"
            else
              echo "❌ Fallback build did not produce $APP_NAME.app"
              echo "📋 Last 200 lines of fallback log:"
              tail -200 build_fallback_log.txt || true
              echo "❌ Build process failed. Check logs above for details."
              exit $BUILD_EXIT_CODE
            fi
          fi

          if [ ! -d "./build/$APP_NAME.xcarchive" ]; then
            echo "❌ Error: Archive was not created at ./build/$APP_NAME.xcarchive"
            echo "📁 Build directory contents:"
            ls -la ./build/
            exit 1
          fi

          echo "✅ Build completed successfully"
          echo "📁 Archive contents:"
          ls -la "./build/$APP_NAME.xcarchive/"

      - name: 📦 Extract App from Archive
        run: |
          echo "📦 Extracting $APP_NAME.app from archive..."

          mkdir -p "./build/export"

          if [ -d "./build/export/$APP_NAME.app" ]; then
            echo "ℹ️ App already present at ./build/export/$APP_NAME.app (from fallback). Skipping extraction."
            ls -la "./build/export/$APP_NAME.app/Contents/" || true
            exit 0
          fi

          echo "📁 Archive structure:"
          find "./build/$APP_NAME.xcarchive" -type d -name "*.app" || {
            echo "🔍 No .app found, showing full archive structure:"
            find "./build/$APP_NAME.xcarchive" -maxdepth 3 -type d
          }

          APP_LOCATIONS=(
            "./build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
            "./build/$APP_NAME.xcarchive/Products/$APP_NAME.app"
            "./build/$APP_NAME.xcarchive/$APP_NAME.app"
          )

          APP_FOUND=false
          for location in "${APP_LOCATIONS[@]}"; do
            if [ -d "$location" ]; then
              echo "✅ Found app at: $location"
              cp -R "$location" "./build/export/"
              APP_FOUND=true
              break
            fi
          done

          if [ "$APP_FOUND" = false ]; then
            echo "❌ Failed to find $APP_NAME.app in any expected location"
            echo "📁 Full archive contents:"
            find "./build/$APP_NAME.xcarchive" -name "*" -type f | head -20
            if [ -d "./build/export/$APP_NAME.app" ]; then
              echo "⚠️ Archive not found, using pre-existing exported app"
            else
              exit 1
            fi
          fi

          if [ -d "./build/export/$APP_NAME.app" ]; then
            echo "✅ Successfully extracted $APP_NAME.app"
            echo "📁 Exported app structure:"
            ls -la "./build/export/$APP_NAME.app/Contents/"

            if [ -f "./build/export/$APP_NAME.app/Contents/MacOS/$APP_NAME" ]; then
              echo "✅ Executable found at Contents/MacOS/$APP_NAME"
            else
              echo "⚠️ Warning: Executable not found at expected location"
              find "./build/export/$APP_NAME.app" -name "$APP_NAME" -type f
            fi
          else
            echo "❌ Failed to extract app properly"
            exit 1
          fi

      - name: 💿 Create DMG
        run: |
          echo "💿 Creating DMG..."

          if [ ! -d "./build/export/$APP_NAME.app" ]; then
            echo "❌ Error: $APP_NAME.app not found in export directory"
            ls -la ./build/export/
            exit 1
          fi

          echo "📱 App bundle details:"
          ls -la "./build/export/$APP_NAME.app/Contents/"

          if [ ! -f "./build/export/$APP_NAME.app/Contents/MacOS/$APP_NAME" ]; then
            echo "❌ Error: Main executable missing in app bundle"
            find "./build/export/$APP_NAME.app" -type f -name "$APP_NAME" || echo "No executable found"
            exit 1
          fi

          if [ ! -f "./build/export/$APP_NAME.app/Contents/Info.plist" ]; then
            echo "❌ Error: Info.plist missing in app bundle"
            exit 1
          fi

          echo "✅ App bundle structure validated"

          if ! command -v create-dmg &> /dev/null; then
            echo "📥 Installing create-dmg..."
            brew install create-dmg
          fi

          echo "🔨 Creating DMG with create-dmg..."
          if create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 200 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 600 185 \
            "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg" \
            "./build/export/"; then
            echo "✅ DMG created successfully with create-dmg"
          else
            echo "⚠️ create-dmg failed, using hdiutil fallback..."
            rm -f "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg"

            if hdiutil create \
              -srcfolder "./build/export/$APP_NAME.app" \
              -volname "$APP_NAME" \
              -format UDZO \
              -imagekey zlib-level=9 \
              "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg"; then
              echo "✅ DMG created successfully with hdiutil fallback"
            else
              echo "❌ Both create-dmg and hdiutil failed"
              exit 1
            fi
          fi

          if [ ! -f "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg" ]; then
            echo "❌ Error: DMG file was not created"
            exit 1
          fi

          echo "🔍 Verifying DMG integrity..."
          if hdiutil verify "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg"; then
            echo "✅ DMG integrity verified"
          else
            echo "⚠️ DMG verification failed, but file exists"
          fi

          echo "📊 DMG created successfully:"
          ls -lh "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg"

      - name: 🔍 Final Validation and Testing
        run: |
          echo "🔍 Performing final validation and testing..."

          hdiutil attach "./build/$APP_NAME-${GITHUB_REF_NAME}.dmg" -mountpoint "/tmp/LiveWalls_Mount" -quiet

          if [ -d "/tmp/LiveWalls_Mount/$APP_NAME.app" ]; then
            echo "✅ App found in DMG"
            ls -la "/tmp/LiveWalls_Mount/$APP_NAME.app/Contents/"

            if [ -f "/tmp/LiveWalls_Mount/$APP_NAME.app/Contents/MacOS/$APP_NAME" ]; then
              echo "✅ Main executable found"
            else
              echo "❌ Main executable missing"
            fi

            if [ -f "/tmp/LiveWalls_Mount/$APP_NAME.app/Contents/Info.plist" ]; then
              echo "✅ Info.plist found in app bundle"
              plutil -lint "/tmp/LiveWalls_Mount/$APP_NAME.app/Contents/Info.plist"
            else
              echo "❌ Info.plist missing in app bundle"
            fi

            echo "📋 App signature status:"
            codesign -dvv "/tmp/LiveWalls_Mount/$APP_NAME.app" 2>&1 | head -10 || echo "App is unsigned (expected)"
          else
            echo "❌ App not found in DMG"
            ls -la "/tmp/LiveWalls_Mount/"
          fi

          hdiutil detach "/tmp/LiveWalls_Mount" -quiet
          echo "✅ Final validation completed"

      - name: 🛠️ Install Sparkle CLI (if needed)
        id: prepare_sparkle
        run: |
          set -e
          echo "📦 Preparing Sparkle artifacts..."

          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "⚠️ SPARKLE_PRIVATE_KEY secret is not set. Skipping appcast generation."
            echo "publish_pages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DMG_PATH="./build/$APP_NAME-${GITHUB_REF_NAME}.dmg"
          if [ ! -f "$DMG_PATH" ]; then
            echo "❌ DMG not found at $DMG_PATH"
            exit 1
          fi

          SPARKLE_VERSION="2.6.0"
          SPARKLE_DIR="$(pwd)/Sparkle-${SPARKLE_VERSION}"
          echo "📥 Downloading Sparkle CLI $SPARKLE_VERSION..."
          curl -L -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"

          rm -rf "$SPARKLE_DIR"
          mkdir -p "$SPARKLE_DIR"
          tar -xf sparkle.tar.xz -C "$SPARKLE_DIR"
          echo "✅ Extracted Sparkle to $SPARKLE_DIR"
          export PATH="$SPARKLE_DIR/bin:$PATH"

          if ! command -v generate_appcast >/dev/null; then
            echo "❌ generate_appcast not found in $SPARKLE_DIR/bin"
            exit 1
          fi

          if ! command -v sign_update >/dev/null; then
            echo "❌ sign_update not found in $SPARKLE_DIR/bin"
            exit 1
          fi

          echo "🖊️ Signing DMG for Sparkle..."
          SIGN_OUTPUT=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | sign_update --ed-key-file - "$DMG_PATH")

          echo "📰 Generating appcast.xml..."
          DIST_REPO="${{ env.DIST_REPO }}"
          DIST_OWNER=$(echo "$DIST_REPO" | cut -d'/' -f1)
          DIST_NAME=$(echo "$DIST_REPO" | cut -d'/' -f2)
          BASE_URL="https://github.com/$DIST_OWNER/$DIST_NAME/releases/download/${GITHUB_REF_NAME}/"
          APP_PATH="./build/export/$APP_NAME.app/Contents/Info.plist"
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH")
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP_PATH" 2>/dev/null || echo "")
          SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          ARCHIVE_LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')
          PUBLISH_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S %z")

          if [ -z "$SIGNATURE" ] || [ -z "$ARCHIVE_LENGTH" ]; then
            echo "❌ Unable to parse signature or length from sign_update output"
            echo "$SIGN_OUTPUT"
            exit 1
          fi

          export BASE_URL SHORT_VERSION BUILD_VERSION MIN_OS SIGNATURE ARCHIVE_LENGTH PUBLISH_DATE
          python3 - <<'PY'
          import os

          app_name = os.environ["APP_NAME"]
          tag_name = os.environ.get("GITHUB_REF_NAME", "")
          base_url = os.environ["BASE_URL"].rstrip('/') + '/'
          short_version = os.environ["SHORT_VERSION"]
          build_version = os.environ["BUILD_VERSION"]
          signature = os.environ["SIGNATURE"]
          length = os.environ["ARCHIVE_LENGTH"]
          publish_date = os.environ["PUBLISH_DATE"]
          min_os = os.environ.get("MIN_OS", "")
          dist_repo = os.environ["DIST_REPO"]
          output_dir = "./public/sparkle"
          os.makedirs(output_dir, exist_ok=True)
          output_path = os.path.join(output_dir, "appcast.xml")

          lines = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<rss version="2.0"',
              '     xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"',
              '     xmlns:dc="http://purl.org/dc/elements/1.1/">',
              '  <channel>',
              f'    <title>{app_name} Updates</title>',
              f'    <link>https://github.com/{dist_repo}/releases/tag/{tag_name}</link>',
              f'    <description>Latest updates for {app_name}</description>',
              '    <language>en</language>',
              f'    <lastBuildDate>{publish_date}</lastBuildDate>',
              '    <item>',
              f'      <title>{app_name} {tag_name}</title>',
              f'      <link>https://github.com/{dist_repo}/releases/tag/{tag_name}</link>',
              f'      <pubDate>{publish_date}</pubDate>',
              '      <enclosure url="{url}" sparkle:version="{version}" sparkle:shortVersionString="{short}" sparkle:edSignature="{sig}" length="{length}" type="application/octet-stream"/>'.format(
                  url=f"{base_url}{app_name}-{tag_name}.dmg",
                  version=build_version,
                  short=short_version,
                  sig=signature,
                  length=length,
              ),
          ]

          if min_os:
              lines.append(f'      <sparkle:minimumSystemVersion>{min_os}</sparkle:minimumSystemVersion>')

          lines.extend([
              '    </item>',
              '  </channel>',
              '</rss>',
              '',
          ])

          with open(output_path, "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PY

          echo "✅ Appcast generated at ./public/sparkle/appcast.xml"
          echo "publish_pages=true" >> "$GITHUB_OUTPUT"

      - name: 🗃️ Detect Site Content
        id: site_check
        run: |
          if [ -d ./site ] && [ "$(ls -A ./site)" ]; then
            echo "has_site=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_site=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: livewalls-dmg
          path: ./build/${{ env.APP_NAME }}-${{ steps.meta.outputs.version }}.dmg
          if-no-files-found: error

      - name: 📤 Upload Sparkle artifact
        if: steps.prepare_sparkle.outputs.publish_pages == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-artifacts
          path: public/sparkle/
          if-no-files-found: error

      - name: 📤 Upload Site artifact
        if: steps.site_check.outputs.has_site == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livewalls-site
          path: site/
          if-no-files-found: error

  release:
    runs-on: macos-latest
    needs: build
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 📦 Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: livewalls-dmg
          path: ./artifacts

      - name: 📦 Download Sparkle metadata
        uses: actions/download-artifact@v4
        with:
          name: sparkle-artifacts
          path: ./sparkle
        continue-on-error: true

      - name: 📦 Download Site bundle
        uses: actions/download-artifact@v4
        with:
          name: livewalls-site
          path: ./site-artifact
        continue-on-error: true

      - name: 🛠️ Install git-cliff
        run: |
          brew install git-cliff

      - name: 📋 Generate Changelog
        id: release_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "$VERSION" | head -n 1)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "📝 Primer release - generando changelog completo"
            CHANGELOG=$(git cliff --tag "$VERSION" --strip all --github-token "$GITHUB_TOKEN")
            if [ -z "$CHANGELOG" ] || [[ "$CHANGELOG" == "## [${VERSION#v}] - $(date +%Y-%m-%d)" ]]; then
              CHANGELOG=$'## 🚀 Cambios en esta versión\n\n🎉 **Primera versión de LiveWalls disponible!**\n\nEsta es la versión inicial de LiveWalls, una aplicación para gestionar fondos de pantalla dinámicos en macOS.'
            fi
          else
            echo "📝 Generando changelog desde $PREVIOUS_TAG hasta $VERSION"
            CHANGELOG=$(git cliff --tag "$VERSION" "$PREVIOUS_TAG".."$VERSION" --strip all --github-token "$GITHUB_TOKEN")
            if [ -z "$CHANGELOG" ] || [[ "$CHANGELOG" == "## [${VERSION#v}] - $(date +%Y-%m-%d)" ]]; then
              echo "⚠️ No se encontraron commits convencionales, usando fallback"
              LOG_ENTRIES=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "$PREVIOUS_TAG".."$VERSION")
              CHANGELOG=$(printf '## 🚀 Cambios en esta versión\n\n%s\n' "$LOG_ENTRIES")
            fi
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish release to distribution repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
          DIST_REPO: ${{ env.DIST_REPO }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ PUBLIC_REPOS_TOKEN secret is required to publish release"
            exit 1
          fi

          NOTES_FILE=$(mktemp)
          printf "%s\n" "${{ steps.release_info.outputs.changelog }}" > "$NOTES_FILE"

          DMG_FILE="./artifacts/${APP_NAME}-${VERSION}.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "❌ DMG file not found at $DMG_FILE"
            exit 1
          fi

          if gh release view "$VERSION" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$DMG_FILE" --repo "$DIST_REPO" --clobber
            gh release edit "$VERSION" --repo "$DIST_REPO" --title "LiveWalls $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" "$DMG_FILE" --repo "$DIST_REPO" --title "LiveWalls $VERSION" --notes-file "$NOTES_FILE"
          fi

      - name: 🗂️ Sync distribution repository content
        env:
          DIST_REPO: ${{ env.DIST_REPO }}
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ PUBLIC_REPOS_TOKEN secret is required to sync distribution repository"
            exit 1
          fi

          ARTIFACT_ROOT=$(pwd)
          WORKDIR=$(mktemp -d)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$DIST_REPO.git" "$WORKDIR"
          cd "$WORKDIR"

          if [ -d "$ARTIFACT_ROOT/site-artifact" ] && [ "$(ls -A "$ARTIFACT_ROOT/site-artifact" 2>/dev/null)" ]; then
            rm -rf site
            mkdir -p site
            rsync -a --delete "$ARTIFACT_ROOT/site-artifact/" site/
            touch site/.nojekyll
          fi

          if [ -f "$ARTIFACT_ROOT/sparkle/appcast.xml" ]; then
            mkdir -p sparkle
            cp "$ARTIFACT_ROOT/sparkle/appcast.xml" appcast.xml
            cp "$ARTIFACT_ROOT/sparkle/appcast.xml" sparkle/appcast.xml
          fi

          git status -sb

          if git diff --quiet && git diff --cached --quiet; then
            echo "ℹ️ No distribution changes detected"
            exit 0
          fi

          git config user.name "LiveWalls CI"
          git config user.email "ci@livewalls.app"
          git add -A
          git commit -m "chore: actualizar artefactos ${VERSION}"
          git push

      - name: 🍺 Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
          TAP_REPO: ${{ env.TAP_REPO }}
          DIST_REPO: ${{ env.DIST_REPO }}
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ PUBLIC_REPOS_TOKEN secret is required to update tap"
            exit 1
          fi

          DMG_PATH="./artifacts/$APP_NAME-$VERSION.dmg"
          if [ ! -f "$DMG_PATH" ]; then
            echo "❌ DMG not found at $DMG_PATH"
            exit 1
          fi

          SHA256_SUM=$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)
          echo "📊 Calculated SHA256: $SHA256_SUM"

          TAP_DIR=$(mktemp -d)
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$TAP_REPO.git" "$TAP_DIR"
          FORMULA_PATH="$TAP_DIR/Formula/livewalls.rb"

          if [ ! -f "$FORMULA_PATH" ]; then
            echo "❌ Formula not found at $FORMULA_PATH"
            exit 1
          fi

          VERSION_NUMBER="${VERSION#v}"
          DOWNLOAD_URL="https://github.com/$DIST_REPO/releases/download/$VERSION/$APP_NAME-$VERSION.dmg"

          sed -i '' "s/version \"[^\"]*\"/version \"$VERSION_NUMBER\"/" "$FORMULA_PATH"
          sed -i '' "s|url \"[^\"]*\"|url \"$DOWNLOAD_URL\"|" "$FORMULA_PATH"
          sed -i '' "s/sha256 \"[^\"]*\"/sha256 \"$SHA256_SUM\"/" "$FORMULA_PATH"

          git -C "$TAP_DIR" status -sb

          if git -C "$TAP_DIR" diff --quiet; then
            echo "ℹ️ No changes detected in tap"
            exit 0
          fi

          git -C "$TAP_DIR" config user.name "LiveWalls CI"
          git -C "$TAP_DIR" config user.email "ci@livewalls.app"
          git -C "$TAP_DIR" add Formula/livewalls.rb
          git -C "$TAP_DIR" commit -m "chore: actualizar fórmula a $VERSION"
          git -C "$TAP_DIR" push

      - name: ✅ Success Notification
        run: |
          echo "🎉 Release $VERSION created successfully!"
          echo "📦 DMG: $APP_NAME-$VERSION.dmg"
          echo "🍺 Homebrew tap actualizado"
          echo "🔗 Release público: https://github.com/${{ env.DIST_REPO }}/releases/tag/$VERSION"
